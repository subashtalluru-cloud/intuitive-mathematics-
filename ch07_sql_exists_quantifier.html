<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
/* INLINED-SELF-CONTAINED-THEME */
:root{
  --part-accent: #4338CA;
  --part-accent-light: #E0E7FF;
  --part-highlight: #DB2777;
  --ink: #1A202C;
  --ink-soft: #4A5568;
  --paper: #FAFAF7;
  --paper-raised: #FFFFFF;
  --line: #D6D3CB;
  --good: #15803D;
  --bad: #B91C1C;
  --radius: 10px;
  --font-serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'SF Mono', 'Cascadia Code', Menlo, monospace;
}
</style>

<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="part02-theme.css">
<style>
  body{ margin:0; padding:24px; background:#EEF0FB; }
  .sql-box{ font-family: var(--font-mono); font-size:0.78rem; background:#1E1E2E; color:#E5E7EB; border-radius:8px; padding:10px; margin-bottom:8px; cursor:pointer; }
</style>
</head>
<body>
<div class="mb-widget">
  <div class="mb-title">SQL's EXISTS Is a Literal ∃</div>
  <div class="mb-sub">Click each query. Watch the database scan animate — EXISTS stops at the first match; NOT EXISTS must check everything.</div>

  <div class="mb-stage">
    <div id="queriesContainer"></div>
    <svg id="scanSvg" viewBox="0 0 280 60" style="width:100%; height:64px; max-width:300px; display:block; margin:8px auto;"></svg>
  </div>
  <div id="fb" class="mb-feedback"></div>
  <div class="mb-caption">Database query planners literally implement existential and universal quantifier logic to decide how to search efficiently.</div>
</div>

<script>
const queries = [
  {sql:"SELECT * FROM customers c WHERE EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id)",
   logic:"∃ o ∈ orders such that o.customer_id = c.id",
   explain:"Literal existential quantifier. The database can stop the instant it finds ONE matching order — the treasure-hunter's 'success on first match' behavior.",
   stopEarly:true},
  {sql:"SELECT * FROM customers c WHERE NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id)",
   logic:"¬∃ o, equivalently ∀ o ∈ orders, o.customer_id ≠ c.id",
   explain:"By ¬∃≡∀¬, this becomes a universal claim in disguise: EVERY order must fail to match. The database must check ALL orders — the inspector's exhaustive-check behavior.",
   stopEarly:false}
];
function animateScan(stopEarly){
  const svg = document.getElementById('scanSvg');
  svg.innerHTML='';
  const n=8, stopAt = stopEarly ? 3 : n;
  for(let i=0;i<n;i++){
    const x = 10+i*33;
    const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
    rect.setAttribute('x',x);rect.setAttribute('y',15);rect.setAttribute('width',26);rect.setAttribute('height',26);rect.setAttribute('rx',4);
    rect.setAttribute('fill', i<stopAt ? (stopEarly && i===stopAt-1 ? 'var(--good)' : 'var(--part-accent-light)') : '#E5E7EB');
    rect.setAttribute('stroke', i<stopAt ? 'var(--part-accent)' : 'var(--line)');
    svg.appendChild(rect);
  }
  const label = document.createElementNS('http://www.w3.org/2000/svg','text');
  label.setAttribute('x',140);label.setAttribute('y',55);label.setAttribute('text-anchor','middle');label.setAttribute('font-size','9');
  label.textContent = stopEarly ? `Stopped after ${stopAt} rows (found match)` : `Checked all ${n} rows (no match found anywhere)`;
  svg.appendChild(label);
}
function render(){
  const container = document.getElementById('queriesContainer');
  container.innerHTML = '';
  queries.forEach((q,i)=>{
    const div = document.createElement('div');
    div.className = 'sql-box';
    div.textContent = q.sql;
    div.onclick = ()=> reveal(i);
    container.appendChild(div);
  });
}
function reveal(i){
  const q = queries[i];
  animateScan(q.stopEarly);
  const fb = document.getElementById('fb');
  fb.className = 'mb-feedback show good';
  fb.innerHTML = `<strong>Quantifier form:</strong> ${q.logic}<br>${q.explain}`;
}
render();
animateScan(true);
</script>
</body>
</html>
